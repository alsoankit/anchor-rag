<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#272b34; --text:#e6e8ec; --dim:#9aa1ad;
    --accent:#4f8cff; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.4px; }
  .sub { color:var(--dim); margin-bottom:22px; font-size:14px; }
  .ask { display:flex; gap:10px; margin-bottom:10px; }
  input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line);
    color:var(--text); padding:12px 14px; border-radius:8px; font-size:15px; }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; padding:12px 22px;
    border-radius:8px; font-size:15px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .opts { display:flex; gap:18px; flex-wrap:wrap; color:var(--dim); font-size:13px;
    margin-bottom:8px; align-items:center; }
  .opts label { cursor:pointer; user-select:none; }
  .examples { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .examples a { color:var(--accent); text-decoration:none; margin-right:14px; cursor:pointer; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px; margin-bottom:18px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.9px;
    color:var(--dim); margin:0 0 12px; font-weight:600; }

  /* the pipeline diagram */
  .flow { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:4px 0; }
  .node { flex:1; min-width:118px; border:1px solid var(--line); border-radius:8px;
    padding:11px 10px; text-align:center; background:#12151b; position:relative;
    transition:border-color .25s, background .25s, box-shadow .25s; }
  .node .name { font-size:12.5px; font-weight:600; }
  .node .det { font-size:11px; color:var(--dim); margin-top:3px; min-height:26px;
    line-height:1.3; word-break:break-word; }
  .node.active { border-color:var(--accent); background:#152138;
    box-shadow:0 0 0 1px var(--accent), 0 0 18px rgba(79,140,255,.25); }
  .node.active .name { color:var(--accent); }
  .node.done { border-color:#24482c; background:#121a14; }
  .node.done .name { color:var(--ok); }
  .node.skipped { opacity:.38; }
  .node.failed { border-color:#5a2222; background:#1c1314; }
  .node.failed .name { color:var(--bad); }
  .arrow { align-self:center; color:var(--line); padding:0 7px; font-size:16px; }

  .answer { font-size:16px; line-height:1.65; }
  .refused { color:var(--warn); }
  .claim { padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .claim:last-child { border-bottom:0; }
  .tag { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    padding:2px 7px; border-radius:4px; margin-right:9px; }
  .tag.ok { background:#12301b; color:var(--ok); }
  .tag.bad { background:#3a1618; color:var(--bad); }
  .quote { color:var(--dim); font-size:12.5px; margin:5px 0 0 54px; font-style:italic; }
  .src { padding:11px 0; border-bottom:1px solid var(--line); }
  .src:last-child { border-bottom:0; }
  .src .head { font-size:13.5px; font-weight:600; }
  .src .meta { color:var(--dim); font-weight:400; font-size:12.5px; }
  .followed { color:var(--warn); }
  .src .body { color:var(--dim); font-size:12.5px; margin-top:4px; }
  .cols { display:grid; grid-template-columns:2fr 1fr; gap:18px; }
  .trace { font-size:12.5px; color:var(--dim); }
  .trace div { padding:3px 0; }
  @media (max-width:860px){ .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Anchor</h1>
  <div class="sub">Answers only what the documents support. Cites every claim. Refuses when
    the evidence is not there.</div>

  <div class="ask">
    <input type="text" id="q" placeholder="Ask something about the corpus">
    <button id="go">Ask</button>
  </div>

  <div class="opts">
    <label><input type="radio" name="corpus" value="aiact" checked> EU AI Act</label>
    <label><input type="radio" name="corpus" value="peps"> Python PEPs</label>
    <span style="color:var(--line)">|</span>
    <label><input type="checkbox" id="hop" checked> follow citations</label>
    <label><input type="checkbox" id="gate" checked> refusal gate</label>
    <label><input type="checkbox" id="check" checked> verify claims</label>
  </div>

  <div class="examples">
    <a data-q="Is an AI system used to evaluate job applicants considered high risk?">needs a citation hop</a>
    <a data-q="Which AI practices does the Regulation prohibit outright?">answerable directly</a>
    <a data-q="What is the maximum fine under the GDPR for unlawful profiling?">should be refused</a>
  </div>

  <div class="panel">
    <h2>Pipeline</h2>
    <div class="flow" id="flow"></div>
  </div>

  <div id="out"></div>
</div>

<script>
const STAGES = [
  ["search",   "Retrieve",  "cosine search over pgvector"],
  ["hop",      "Follow",    "walk citation edges"],
  ["gate",     "Gate",      "is the evidence enough?"],
  ["generate", "Generate",  "answer from sources only"],
  ["verify",   "Verify",    "check every claim"],
];

const flow = document.getElementById("flow");
function drawFlow() {
  flow.innerHTML = "";
  STAGES.forEach(([id, name, hint], i) => {
    if (i) { const a = document.createElement("div"); a.className = "arrow";
             a.textContent = "→"; flow.appendChild(a); }
    const n = document.createElement("div");
    n.className = "node"; n.id = "n-" + id;
    n.innerHTML = `<div class="name">${name}</div><div class="det">${hint}</div>`;
    flow.appendChild(n);
  });
}
drawFlow();

function setNode(id, cls, detail) {
  const n = document.getElementById("n-" + id);
  if (!n) return;
  if (cls) n.className = "node " + cls;
  if (detail !== undefined) n.querySelector(".det").textContent = detail;
}

const out = document.getElementById("out");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.querySelectorAll(".examples a").forEach(a =>
  a.onclick = () => { document.getElementById("q").value = a.dataset.q; run(); });
document.getElementById("go").onclick = run;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

let source = null;

function run() {
  const question = document.getElementById("q").value.trim();
  if (!question) return;
  if (source) source.close();

  drawFlow();
  out.innerHTML = "";
  document.getElementById("go").disabled = true;

  const corpus = document.querySelector("input[name=corpus]:checked").value;
  const hop = document.getElementById("hop").checked;
  const gate = document.getElementById("gate").checked;
  const check = document.getElementById("check").checked;
  if (!hop) setNode("hop", "skipped");
  if (!gate) setNode("gate", "skipped");
  if (!check) setNode("verify", "skipped");

  const url = `/ask/stream?question=${encodeURIComponent(question)}&corpus=${corpus}`
            + `&hop=${hop}&gate=${gate}&check=${check}`;
  source = new EventSource(url);

  source.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    const [base, phase] = msg.stage.split(".");

    if (msg.stage === "result")  { render(msg.payload); finish(); return; }
    if (msg.stage === "error")   { out.innerHTML = `<div class="panel refused">${esc(msg.detail)}</div>`;
                                   finish(); return; }
    if (msg.stage === "refused") { setNode("generate", "failed", msg.detail); return; }
    if (msg.stage === "rewrite") { setNode("gate", "failed", msg.detail); return; }

    if (phase === "done") setNode(base, "done", msg.detail);
    else                  setNode(base, "active", msg.detail);
  };
  source.onerror = finish;
}

function finish() {
  document.getElementById("go").disabled = false;
  if (source) { source.close(); source = null; }
  document.querySelectorAll(".node.active").forEach(n => n.className = "node done");
}

function render(r) {
  let html = `<div class="panel"><h2>Answer${r.refused ? " — refused" : ""}</h2>`
           + `<div class="answer${r.refused ? " refused" : ""}">${esc(r.answer)}</div>`
           + (r.refused && r.reason ? `<div class="quote" style="margin-left:0">${esc(r.reason)}</div>` : "")
           + `</div>`;

  if (r.claims.length) {
    const bad = r.claims.filter(c => !c.supported).length;
    html += `<div class="panel"><h2>Claim check — ${r.claims.length - bad} of ${r.claims.length} supported</h2>`;
    r.claims.forEach(c => {
      html += `<div class="claim"><span class="tag ${c.supported ? "ok" : "bad"}">`
            + `${c.supported ? "supported" : "not supported"}</span>${esc(c.claim)}`
            + (c.quote ? `<div class="quote">“${esc(c.quote)}”</div>` : "") + `</div>`;
    });
    html += `</div>`;
  }

  html += `<div class="cols"><div class="panel"><h2>Sources</h2>`;
  r.sources.forEach(s => {
    html += `<div class="src"><div class="head">[${s.marker}] ${esc(s.citation)}`
          + `<span class="meta"> · score ${s.score}`
          + (s.followed_from ? ` · <span class="followed">followed from ${esc(s.followed_from)}</span>` : "")
          + `</span></div><div class="body">${esc(s.text)}…</div></div>`;
  });
  html += `</div><div class="panel"><h2>What it did · ${r.seconds}s</h2><div class="trace">`
        + r.trace.map(t => `<div>${esc(t)}</div>`).join("") + `</div></div></div>`;
  out.innerHTML = html;
}
</script>
</body>
</html>
